name: Kanpo Daily Image Converter

on:
  schedule:
    - cron: '30 0 * * *' # 毎日日本時間 9:30 AM 頃
  workflow_dispatch:

jobs:
  convert-kanpo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymupdf google-api-python-client google-auth-oauthlib

      - name: Run Python Converter Script
        env:
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
        run: python convert_kanpo.py
