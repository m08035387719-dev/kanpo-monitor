name: Kanpo Daily Image Converter

on:
  schedule:
    # 毎日 UTC 0:00（日本時間 午前9:00）に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動でもいつでも実行可能

jobs:
  convert-kanpo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Converter Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: "ここにGoogleドライブの保存先フォルダIDを貼り付けてください"
        run: |
          python convert_kanpo.py
